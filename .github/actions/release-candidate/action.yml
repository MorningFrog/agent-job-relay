name: Load the original release candidate
description: Verify the original successful run before downloading its immutable candidate
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: '24.21.0'
        package-manager-cache: false
    - name: Verify original Prepare Release identity and resolve the exact artifact
      id: origin
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/release_actions.py run --candidate-run-id "$CANDIDATE_RUN_ID"
    - uses: actions/download-artifact@v8.0.2
      with:
        artifact-ids: ${{ steps.origin.outputs.artifact_id }}
        run-id: ${{ env.CANDIDATE_RUN_ID }}
        github-token: ${{ github.token }}
        path: ${{ steps.origin.outputs.bundle == 'true' && '.tmp' || '.tmp/release-candidate' }}
    - name: Verify the full sealed bundle before extracting
      if: steps.origin.outputs.bundle == 'true'
      shell: bash
      env:
        SEALED_REVISION: ${{ steps.origin.outputs.revision }}
      run: node scripts/ci_artifacts.mjs extract release-candidate
