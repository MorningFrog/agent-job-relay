name: Prepare Release
run-name: ${{ inputs.pipeline_key && format('Prepare Release [{0}]', inputs.pipeline_key) || 'Prepare Release' }}
on:
  workflow_dispatch:
    inputs:
      channel:
        description: latest for a formal release or next for an experimental release
        type: choice
        default: latest
        options: [latest, next]
      pipeline_key:
        description: Internal Release All correlation key
        type: string
        default: ''
      expected_revision:
        description: Internal Release All source fence
        type: string
        default: ''
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  EXPECTED_RELEASE_REVISION: ${{ inputs.expected_revision }}
concurrency:
  group: agent-job-relay-release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Validate manual source, finalized version and availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_actions.py prepare
  msrv:
    needs: preflight
    uses: ./.github/workflows/native.yml
    with:
      platform: msrv
      preparation: true
  linux:
    needs: preflight
    uses: ./.github/workflows/native.yml
    with:
      platform: linux
      preparation: true
  windows:
    needs: preflight
    uses: ./.github/workflows/native.yml
    with:
      platform: windows
      preparation: true
  packages:
    needs: [linux, windows]
    uses: ./.github/workflows/packages.yml
    with:
      preparation: true
  candidate:
    needs: [msrv, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-packages
          path: .tmp
      - name: Seal the installed and verified bytes from this manual run
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/ci_artifacts.mjs extract release-packages
          mv .tmp/release-packages .tmp/release-candidate
          python3 scripts/release_actions.py seal --channel "$RELEASE_CHANNEL"
          node scripts/ci_artifacts.mjs pack release-candidate
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-candidate-bundle
          path: .tmp/release-candidate.ajr
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
