name: Prepare Release
run-name: ${{ inputs.pipeline_key && format('Prepare Release [{0}]', inputs.pipeline_key) || 'Prepare Release' }}
on:
  workflow_dispatch:
    inputs:
      channel:
        description: latest for a formal release; next for an experimental release
        type: choice
        default: latest
        options: [latest, next]
      pipeline_key:
        description: Internal Release All correlation key; leave empty for manual use
        type: string
        default: ''
      expected_revision:
        description: Internal Release All source fence; leave empty for manual use
        type: string
        default: ''
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  EXPECTED_RELEASE_REVISION: ${{ inputs.expected_revision }}
concurrency:
  group: agent-job-relay-release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Check release state-machine regressions
        run: python3 -m unittest discover -s scripts -p test_release.py -v
      - name: Validate Cargo version, pins, CHANGELOG and tag availability
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_actions.py prepare
  windows:
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Build bundled React and Vite UI
        run: |
          npm ci --prefix web --ignore-scripts --no-audit --no-fund
          npm test --prefix web
          npm run build --prefix web
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked
      - name: Describe the tested native executable
        run: ./scripts/describe_native.ps1 -Binary target/release/agent-job-relay.exe -Output target/windows-native.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-native
          path: |
            target/release/agent-job-relay.exe
            target/windows-native.json
          if-no-files-found: error
          retention-days: 14
  package:
    needs: [preflight, windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Build bundled React and Vite UI
        run: |
          npm ci --prefix web --ignore-scripts --no-audit --no-fund
          npm test --prefix web
          npm run build --prefix web
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked
      - name: Install isolated host test tools
        run: npm install --prefix .tmp/opencode-toolchain --cache .tmp/npm-cache --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org opencode-ai@1.19.4 @opencode-ai/plugin@1.19.4 @opencode-ai/sdk@1.19.4 @openai/codex@0.164.0
      - uses: actions/download-artifact@v8.0.2
        with:
          name: windows-native
          path: .tmp/windows-native
      - name: Bundle Linux glibc 2.35 and Windows from this revision
        run: python3 scripts/prepare_release.py --output .tmp/release-candidate --windows-binary .tmp/windows-native/release/agent-job-relay.exe --windows-metadata .tmp/windows-native/windows-native.json
      - name: Verify installed packages and both actual loaders
        run: python3 scripts/check_release.py --release .tmp/release-candidate --opencode .tmp/opencode-toolchain/node_modules/opencode-linux-x64/bin/opencode --codex "$PWD/.tmp/opencode-toolchain/node_modules/.bin/codex"
      - name: Check Claude framework without claiming a Claude host test
        run: python3 scripts/check_claude_scaffold.py --binary "$PWD/target/release/agent-job-relay"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-packages
          path: .tmp/release-candidate/*
          if-no-files-found: error
          retention-days: 14
  windows-packages:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-packages
          path: .tmp/release-candidate
      - name: Install isolated host tools
        run: npm install --prefix .tmp/host-tools --cache .tmp/npm-cache --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org opencode-ai@1.19.4 @openai/codex@0.164.0
      - name: Verify installed Windows packages and actual host loaders
        run: node scripts/check_windows_packages.mjs --release .tmp/release-candidate --codex-entry "$PWD/.tmp/host-tools/node_modules/@openai/codex/bin/codex.js" --opencode "$PWD/.tmp/host-tools/node_modules/opencode-windows-x64/bin/opencode.exe"
      - name: Preserve isolated Windows package failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-package-diagnostics
          path: |
            .tmp/wp-*/report.json
            .tmp/wp-*/*.stdout
            .tmp/wp-*/*.stderr
            .tmp/wp-*/*.log
          if-no-files-found: ignore
          retention-days: 7
  candidate:
    needs: [package, windows-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-packages
          path: .tmp/release-candidate
      - name: Seal the verified bytes and generate Release Notes from CHANGELOG
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: python3 scripts/release_actions.py seal --channel "$RELEASE_CHANNEL"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-candidate
          path: .tmp/release-candidate/*
          if-no-files-found: error
          retention-days: 14
