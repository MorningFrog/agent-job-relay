name: Publish Release
run-name: ${{ inputs.pipeline_key && format('Publish Release [{0}]', inputs.pipeline_key) || 'Publish Release' }}
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Original successful Prepare Release Run ID
        required: true
        type: string
      operation:
        description: Preview read-only, stage for npm 2FA approval, or finalize GitHub
        type: choice
        default: preview
        options: [preview, stage, finalize]
      recover_candidate:
        description: Allow only release-tooling or documentation repairs since preparation
        type: boolean
        default: false
      pipeline_key:
        description: Internal Release All correlation key
        type: string
        default: ''
      expected_revision:
        description: Internal Release All source fence
        type: string
        default: ''
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
  RECOVER_CANDIDATE: ${{ inputs.recover_candidate }}
  EXPECTED_RELEASE_REVISION: ${{ inputs.expected_revision }}
concurrency:
  group: agent-job-relay-release
  cancel-in-progress: false
jobs:
  selection:
    name: Require the original repository and main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Validate the manual selection before opening a release environment
        run: |
          if [[ "$GITHUB_REPOSITORY" != MorningFrog/agent-job-relay || "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Select main in MorningFrog/agent-job-relay."
            exit 1
          fi
  preview:
    needs: selection
    if: inputs.operation == 'preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-candidate
      - name: Preview the sealed candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_actions.py preview --candidate-run-id "$CANDIDATE_RUN_ID"
  stage:
    needs: selection
    if: github.ref == 'refs/heads/main' && inputs.operation == 'stage'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-stage
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-candidate
      - run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org npm@11.21.1
      - name: Stage exact tarballs for maintainer approval
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_STAGE_TOKEN: ${{ secrets.NPM_STAGE_TOKEN }}
        run: python3 scripts/release_actions.py stage --candidate-run-id "$CANDIDATE_RUN_ID"
  finalize:
    needs: selection
    if: github.ref == 'refs/heads/main' && inputs.operation == 'finalize'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-candidate
      - name: Publish GitHub only after both public npm tarballs and channels match
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_actions.py finalize --candidate-run-id "$CANDIDATE_RUN_ID"
