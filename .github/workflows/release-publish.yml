name: Publish Release
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Original successful Prepare Release Run ID
        required: true
        type: string
      dry_run:
        description: Verify the candidate and publishing identity without changing npm or GitHub
        type: boolean
        default: true
      recover_candidate:
        description: Allow only release-tooling/documentation repairs since candidate creation
        type: boolean
        default: false
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
  RECOVER_CANDIDATE: ${{ inputs.recover_candidate }}
concurrency:
  group: agent-job-relay-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org npm@11.21.1
      - name: Check release state-machine regressions
        run: python3 -m unittest discover -s scripts -p test_release.py -v
      - name: Validate the candidate run and actual publishing identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_actions.py preflight --auth oidc
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: .tmp/release-candidate
      - name: Preview the sealed candidate without changing registry or Release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_actions.py preview --candidate-run-id "$CANDIDATE_RUN_ID" --auth oidc
  publish:
    needs: verify
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org npm@11.21.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: .tmp/release-candidate
      - name: Publish the original verified bytes through Trusted Publishing
        id: npm
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_actions.py publish --candidate-run-id "$CANDIDATE_RUN_ID" --auth oidc
      - name: Verify public installation and complete GitHub Release
        if: steps.npm.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_actions.py finalize --candidate-run-id "$CANDIDATE_RUN_ID" --auth oidc
