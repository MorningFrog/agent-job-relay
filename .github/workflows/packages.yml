name: Package verification
on:
  workflow_call:
    inputs:
      preparation:
        type: boolean
        default: false
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PACKAGE_ARTIFACT: ${{ inputs.preparation && 'release-packages' || 'ci-packages' }}
jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: linux-native
          path: .tmp
      - uses: actions/download-artifact@v8.0.2
        with:
          name: windows-native
          path: .tmp
      - name: Verify this run's native bytes before extraction
        run: |
          node scripts/ci_artifacts.mjs extract linux-native
          node scripts/ci_artifacts.mjs extract windows-native
      - name: Check the exact release executable on glibc 2.34
        if: inputs.preparation
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/workspace" \
            almalinux:9-minimal@sha256:7dc48de6be22bf7271c217984310e413901c570c4e4eb0 \
            sh /workspace/scripts/check_release_compatibility.sh .tmp/linux-native/agent-job-relay
      - name: Package the exact Linux and Windows executables
        env:
          DEVELOPMENT: ${{ !inputs.preparation && '--allow-unreleased' || '' }}
        run: |
          python3 scripts/prepare_release.py ${DEVELOPMENT:+"$DEVELOPMENT"} \
            --binary .tmp/linux-native/agent-job-relay \
            --windows-binary .tmp/windows-native/agent-job-relay.exe \
            --windows-metadata .tmp/windows-native/windows-native.json \
            --output ".tmp/$PACKAGE_ARTIFACT"
          node scripts/ci_artifacts.mjs pack "$PACKAGE_ARTIFACT"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: .tmp/${{ env.PACKAGE_ARTIFACT }}.ajr
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ inputs.preparation && 14 || 7 }}
  linux:
    name: Installed Linux packages
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: actions/download-artifact@v8.0.2
        if: inputs.preparation
        with:
          name: linux-native
          path: .tmp
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: .tmp
      - name: Verify the package bundle and run release script tests
        run: |
          node scripts/ci_artifacts.mjs extract "$PACKAGE_ARTIFACT"
          python3 -m unittest discover -s scripts -p test_release.py -v
      - name: Check installed development packages
        if: '!inputs.preparation'
        run: python3 scripts/check_release.py --release ".tmp/$PACKAGE_ARTIFACT"
      - name: Install isolated host test tools
        if: inputs.preparation
        run: |
          node scripts/ci_artifacts.mjs extract linux-native
          npm install --prefix .tmp/host-tools --cache .tmp/npm-cache --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org opencode-ai@1.19.4 @opencode-ai/plugin@1.19.4 @opencode-ai/sdk@1.19.4 @openai/codex@0.164.0
      - name: Check installed release candidates and host loaders
        if: inputs.preparation
        run: |
          python3 scripts/check_release.py --release ".tmp/$PACKAGE_ARTIFACT" \
            --binary .tmp/linux-native/agent-job-relay \
            --opencode "$PWD/.tmp/host-tools/node_modules/opencode-linux-x64/bin/opencode" \
            --codex "$PWD/.tmp/host-tools/node_modules/.bin/codex"
          python3 scripts/check_claude_scaffold.py --binary "$PWD/.tmp/linux-native/agent-job-relay"
  windows:
    name: Installed Windows packages
    needs: package
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: .tmp
      - name: Verify this run's package bytes before installing
        run: node scripts/ci_artifacts.mjs extract $env:PACKAGE_ARTIFACT
      - name: Check installed Windows development packages
        if: '!inputs.preparation'
        run: node scripts/check_windows_packages.mjs --release ".tmp/$env:PACKAGE_ARTIFACT"
      - name: Check installed Windows release candidates and host loaders
        if: inputs.preparation
        run: ./scripts/ci_windows_packages.ps1 -ReleaseDirectory ".tmp/$env:PACKAGE_ARTIFACT"
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: windows-package-diagnostics-${{ github.run_attempt }}
          path: |
            .tmp/wp-*/report.json
            .tmp/wp-*/*.stdout
            .tmp/wp-*/*.stderr
            .tmp/wp-*/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
