name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Linux runtime and all behavior tests
        if: runner.os == 'Linux'
        run: cargo test --all-targets --locked
      - name: Other platforms compile and portable schema tests only
        if: runner.os != 'Linux'
        run: cargo test --lib --locked
      - run: cargo build --release --locked
      - run: cargo run --locked -- --help
      # Distribution, signing and publishing are deferred; no release credentials.
