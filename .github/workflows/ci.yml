name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  msrv:
    uses: ./.github/workflows/native.yml
    with:
      platform: msrv
  linux:
    uses: ./.github/workflows/native.yml
    with:
      platform: linux
  windows:
    uses: ./.github/workflows/native.yml
    with:
      platform: windows
  macos:
    uses: ./.github/workflows/native.yml
    with:
      platform: macos
  packages:
    needs: [linux, windows]
    uses: ./.github/workflows/packages.yml
  required:
    name: CI required
    if: ${{ always() }}
    needs: [msrv, linux, windows, macos, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job
        env:
          MSRV: ${{ needs.msrv.result }}
          LINUX: ${{ needs.linux.result }}
          WINDOWS: ${{ needs.windows.result }}
          MACOS: ${{ needs.macos.result }}
          PACKAGES: ${{ needs.packages.result }}
        run: |
          for result in "$MSRV" "$LINUX" "$WINDOWS" "$MACOS" "$PACKAGES"; do
            test "$result" = success || exit 1
          done
