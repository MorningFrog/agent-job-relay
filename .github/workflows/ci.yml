name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Linux runtime and all behavior tests
        if: runner.os == 'Linux'
        run: cargo test --all-targets --locked
      - name: Other platforms compile and portable schema tests only
        if: runner.os != 'Linux'
        run: cargo test --lib --locked
      - run: cargo build --release --locked
      - run: cargo run --locked -- --help
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'
      - name: Isolated host-plugin dependencies
        if: runner.os == 'Linux'
        run: npm install --prefix .tmp/opencode-toolchain --cache .tmp/npm-cache --ignore-scripts --no-audit --no-fund opencode-ai@1.19.4 @opencode-ai/plugin@1.19.4 @opencode-ai/sdk@1.19.4
      - name: Pack native runtime, OpenCode and self-hosted marketplace candidates
        if: runner.os == 'Linux'
        run: python3 scripts/prepare_release.py --output .tmp/release-candidate
      - name: Install candidate packages and check actual OpenCode with simulated model
        if: runner.os == 'Linux'
        run: python3 scripts/check_release.py --release .tmp/release-candidate --opencode .tmp/opencode-toolchain/node_modules/opencode-linux-x64/bin/opencode
      - name: Claude scaffold only, without a Claude account or loader
        if: runner.os == 'Linux'
        run: python3 scripts/check_claude_scaffold.py --binary "$PWD/target/release/agent-job-relay"
      # Push/PR jobs verify only. Release is a separate manual workflow.
