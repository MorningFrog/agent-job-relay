name: Check Release
run-name: ${{ inputs.pipeline_key && format('Check Release [{0}]', inputs.pipeline_key) || 'Check Release' }}
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Original successful Prepare Release Run ID
        required: true
        type: string
      recover_candidate:
        description: Allow only release-tooling or documentation repairs since preparation
        type: boolean
        default: false
      pipeline_key:
        description: Internal Release All correlation key
        type: string
        default: ''
      expected_revision:
        description: Internal Release All source fence
        type: string
        default: ''
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
  RECOVER_CANDIDATE: ${{ inputs.recover_candidate }}
  EXPECTED_RELEASE_REVISION: ${{ inputs.expected_revision }}
concurrency:
  group: agent-job-relay-check-${{ inputs.candidate_run_id }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-candidate
      - name: Check public bytes, channel, installation, Tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_actions.py check --candidate-run-id "$CANDIDATE_RUN_ID"
