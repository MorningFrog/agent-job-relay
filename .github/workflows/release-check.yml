name: Check Release
run-name: ${{ inputs.pipeline_key && format('Check Release [{0}]', inputs.pipeline_key) || 'Check Release' }}
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Original successful Prepare Release Run ID
        required: true
        type: string
      recover_candidate:
        description: Allow only release-tooling/documentation repairs since candidate creation
        type: boolean
        default: false
      pipeline_key:
        description: Internal Release All correlation key; leave empty for manual use
        type: string
        default: ''
      expected_revision:
        description: Internal Release All source fence; leave empty for manual use
        type: string
        default: ''
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
  RECOVER_CANDIDATE: ${{ inputs.recover_candidate }}
  EXPECTED_RELEASE_REVISION: ${{ inputs.expected_revision }}
concurrency:
  group: agent-job-relay-check-${{ inputs.candidate_run_id }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Validate the original candidate run without publishing credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_actions.py run --candidate-run-id "$CANDIDATE_RUN_ID"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: .tmp/release-candidate
      - name: Check public bytes, channel, installation and GitHub without any remote write
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_actions.py check --candidate-run-id "$CANDIDATE_RUN_ID"
