[package]
name = "agent-job-relay"
version = "0.1.15"
edition = "2024"
rust-version = "1.89"
description = "Session-aware durable background jobs for local AI agents"
license = "MIT"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio-stream = "0.1"
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
flate2 = "1"
memchr = "2"
rmcp = { version = "3.7", features = ["transport-io", "elicitation"] }
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "libsqlite3-sys", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.54", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
toml_edit = { version = "0.25", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

# Keep installed-debug fixtures below the same native payload budget as releases.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
