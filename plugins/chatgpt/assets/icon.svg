
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1024 1024"
     role="img"
     aria-labelledby="title desc">
  <title id="title">AgentJobRelay</title>
  <desc id="desc">
    AI agent, background job, and event relay icon.
  </desc>

  <!-- Colors:
       Navy  #09286B
       Blue  #087DFA
       Green #00BE91
       Gray  #91A6CA
  -->

  <!-- Relay arrows -->
  <g fill="none"
     stroke="#087DFA"
     stroke-width="50"
     stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M480 206
             C650 168 800 252 843 416"/>
    <path d="M782 405 L843 460 L895 401"/>

    <path d="M296 720
             C354 811 426 853 496 863"/>
    <path d="M546 862
             C605 853 654 821 682 786"/>
  </g>

  <!-- Agent antenna -->
  <path d="M384 268 V332"
        stroke="#09286B"
        stroke-width="44"
        stroke-linecap="round"/>
  <circle cx="384" cy="198" r="70"
          fill="#09286B"/>
  <circle cx="384" cy="198" r="44"
          fill="#087DFA"/>

  <!-- Robot side panels -->
  <rect x="105" y="410"
        width="99" height="172" rx="48"
        fill="#09286B"/>
  <rect x="128" y="451"
        width="29" height="87" rx="14"
        fill="#FFFFFF"/>

  <rect x="568" y="410"
        width="98" height="172" rx="48"
        fill="#09286B"/>
  <rect x="613" y="451"
        width="28" height="87" rx="14"
        fill="#FFFFFF"/>

  <!-- Robot speech-bubble silhouette -->
  <path
    d="M282 304
       H466
       C553 304 613 373 613 459
       V541
       C613 616 553 665 471 665
       H323
       L242 707
       C222 717 201 701 205 675
       L216 626
       C169 598 146 557 146 492
       V468
       C146 374 195 304 282 304 Z"
    fill="#09286B"/>

  <!-- Robot face -->
  <path
    d="M291 360
       H463
       C530 360 563 406 563 474
       V508
       C563 580 517 617 457 617
       H319
       C301 617 289 619 272 629
       L237 653
       L244 610
       C218 590 195 553 195 510
       V470
       C195 405 233 360 291 360 Z"
    fill="#FFFFFF"/>

  <!-- Eyes -->
  <rect x="267" y="445"
        width="54" height="91" rx="27"
        fill="#09286B"/>
  <rect x="439" y="445"
        width="54" height="91" rx="27"
        fill="#09286B"/>

  <!-- Smile -->
  <path d="M345 559 Q380 591 416 559"
        fill="none"
        stroke="#09286B"
        stroke-width="25"
        stroke-linecap="round"/>

  <!-- Completed job card -->
  <rect x="670" y="506"
        width="270" height="282" rx="49"
        fill="#09286B"/>
  <rect x="700" y="536"
        width="210" height="222" rx="29"
        fill="#FFFFFF"/>

  <!-- Job completion check -->
  <path d="M754 622 L789 657 L858 589"
        fill="none"
        stroke="#00BE91"
        stroke-width="31"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Job detail lines -->
  <g stroke="#91A6CA"
     stroke-width="23"
     stroke-linecap="round">
    <path d="M748 692 H869"/>
    <path d="M748 730 H869"/>
  </g>

  <!-- Relay checkpoint -->
  <circle cx="520" cy="863" r="80"
          fill="#09286B"/>
  <circle cx="520" cy="863" r="54"
          fill="#FFFFFF"/>
  <circle cx="520" cy="863" r="31"
          fill="#00BE91"/>
</svg>
