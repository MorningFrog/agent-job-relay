labels:
  platform: windows/amd64
  backend: local
  worker: ajr-win

clone:
  - name: git
    image: woodpeckerci/plugin-git:2.12.1
    settings:
      # MinGit has no Git LFS; this repository contains no LFS objects.
      lfs: false
      partial: false

when:
  - event: push
    branch: main
  - event: pull_request
  - event: manual
    evaluate: 'AJR_RELEASE_TASK != "prepare" && AJR_RELEASE_TASK != "rehearse" && AJR_RELEASE_TASK != "inspect" && AJR_RELEASE_TASK != "identity" && AJR_RELEASE_TASK != "preview" && AJR_RELEASE_TASK != "stage" && AJR_RELEASE_TASK != "finalize" && AJR_RELEASE_TASK != "check"'

# Development verification only. No publication credentials or release promotion.
# The Local backend interprets image as a shell executable.
steps:
  - name: toolchain
    image: pwsh
    commands:
      - ./scripts/ci_windows.ps1 toolchain

  - name: frontend
    image: pwsh
    commands:
      - ./scripts/ci_windows.ps1 frontend

  - name: native
    image: pwsh
    commands:
      - ./scripts/ci_windows.ps1 native

  - name: upload-native
    image: pwsh
    environment:
      AJR_CI_ARTIFACT_ENDPOINT:
        from_secret: ci_artifact_endpoint
      AJR_CI_ARTIFACT_CA:
        from_secret: ci_artifact_ca
      AJR_CI_ARTIFACT_TOKEN:
        from_secret: ci_artifact_windows_token
    commands:
      - node scripts/ci_artifacts.mjs upload windows-native
