# Explicit manual operation; never build, retag or approve npm packages here.
labels:
  platform: linux/amd64
  backend: docker
  worker: ajr-publish

clone:
  - name: git
    image: woodpeckerci/plugin-git:2.11.0
    settings:
      depth: 0
      partial: false
      lfs: false

workspace:
  base: /woodpecker
  path: src

when:
  - event: manual
    branch: main
    evaluate: 'AJR_RELEASE_TASK == "finalize"'

steps:
  - name: read-original-candidate
    image: node:24.21.0-bookworm@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
    environment:
      AJR_PUBLISH_ARTIFACT_ENDPOINT:
        from_secret: release_artifact_endpoint
      AJR_PUBLISH_ARTIFACT_CA:
        from_secret: release_artifact_ca
      AJR_PUBLISH_ARTIFACT_TOKEN:
        from_secret: release_artifact_publisher_token
    commands:
      - python3 -B scripts/release_publish.py request
      - node scripts/release_publish_artifacts.mjs

  - name: finalize
    image: node:24.21.0-bookworm@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
    environment:
      GH_TOKEN:
        from_secret: publish_github_token
    commands:
      - python3 -B scripts/release_publish.py finalize --apply
