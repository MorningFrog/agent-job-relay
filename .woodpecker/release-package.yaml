# Manual preparation only; no npm/GitHub publication credentials.
labels:
  platform: linux/amd64
  backend: docker
  worker: ajr-release

workspace:
  base: /woodpecker
  path: src

depends_on: [release-linux, release-windows]

when:
  - event: manual
    evaluate: 'AJR_RELEASE_TASK == "prepare" || AJR_RELEASE_TASK == "rehearse"'

steps:
  - name: download-exact-native
    image: node:24.21.0-bookworm@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
    environment:
      AJR_RELEASE_ARTIFACT_ENDPOINT:
        from_secret: release_artifact_endpoint
      AJR_RELEASE_ARTIFACT_CA:
        from_secret: release_artifact_ca
      AJR_RELEASE_ARTIFACT_TOKEN:
        from_secret: release_artifact_linux_token
    commands:
      - node scripts/release_artifacts.mjs download release-preflight
      - node scripts/release_artifacts.mjs download release-linux-native
      - node scripts/release_artifacts.mjs download release-windows-native

  - name: prepare-and-check
    image: node:24.21.0-bookworm@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
    commands:
      - python3 -B scripts/release_woodpecker.py package
      - npm install --prefix .tmp/opencode-toolchain --cache /ci-cache/release-host-npm --ignore-scripts --no-audit --no-fund --prefer-offline --registry=https://registry.npmjs.org opencode-ai@1.19.4 @opencode-ai/plugin@1.19.4 @opencode-ai/sdk@1.19.4 @openai/codex@0.164.0
      - python3 -B scripts/check_release.py --release .tmp/release-packages --binary .tmp/release-input/linux/agent-job-relay --opencode .tmp/opencode-toolchain/node_modules/opencode-linux-x64/bin/opencode --codex "$PWD/.tmp/opencode-toolchain/node_modules/.bin/codex"
      - python3 -B scripts/check_claude_scaffold.py --binary "$PWD/.tmp/release-input/linux/agent-job-relay"

  - name: upload-packages
    image: node:24.21.0-bookworm@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
    environment:
      AJR_RELEASE_ARTIFACT_ENDPOINT:
        from_secret: release_artifact_endpoint
      AJR_RELEASE_ARTIFACT_CA:
        from_secret: release_artifact_ca
      AJR_RELEASE_ARTIFACT_TOKEN:
        from_secret: release_artifact_linux_token
    commands:
      - node scripts/release_artifacts.mjs upload release-packages

