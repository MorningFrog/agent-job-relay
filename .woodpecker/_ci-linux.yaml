labels:
  platform: linux/amd64
  backend: docker
  cache: ajr-linux-v1

# Match local execution and leave room for fixture Unix socket paths.
workspace:
  base: /woodpecker
  path: src

when:
  - event: push
    branch: main
  - event: pull_request
  - event: manual
    evaluate: 'AJR_RELEASE_TASK != "prepare" && AJR_RELEASE_TASK != "rehearse" && AJR_RELEASE_TASK != "inspect" && AJR_RELEASE_TASK != "identity" && AJR_RELEASE_TASK != "preview" && AJR_RELEASE_TASK != "stage" && AJR_RELEASE_TASK != "finalize" && AJR_RELEASE_TASK != "check"'

# Verification only: no publishing secrets, host mounts or privileged steps.
steps:
  - name: toolchain
    image: node:24.21.0-bookworm@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
    commands:
      - sh scripts/ci_linux.sh toolchain

  - name: frontend
    image: node:24.21.0-bookworm@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
    commands:
      - sh scripts/ci_linux.sh frontend

  - name: msrv
    image: node:24.21.0-bookworm@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
    commands:
      - sh scripts/ci_linux.sh msrv

  - name: native
    image: node:24.21.0-bookworm@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
    commands:
      - sh scripts/ci_linux.sh native

  - name: upload-native
    image: node:24.21.0-bookworm@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
    environment:
      AJR_CI_ARTIFACT_ENDPOINT:
        from_secret: ci_artifact_endpoint
      AJR_CI_ARTIFACT_CA:
        from_secret: ci_artifact_ca
      AJR_CI_ARTIFACT_TOKEN:
        from_secret: ci_artifact_linux_token
    commands:
      - node scripts/ci_artifacts.mjs upload linux-native

  - name: cache
    image: node:24.21.0-bookworm@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
    commands:
      - sh scripts/ci_linux.sh cache
    when:
      - event: [push, pull_request, manual]
        status: [success, failure]
