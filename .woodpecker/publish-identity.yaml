# Explicit manual operation; never build, retag or approve npm packages here.
labels:
  platform: linux/amd64
  backend: docker
  worker: ajr-publish

clone:
  - name: git
    image: woodpeckerci/plugin-git:2.11.0
    settings:
      depth: 0
      partial: false
      lfs: false

workspace:
  base: /woodpecker
  path: src

when:
  - event: manual
    branch: main
    evaluate: 'AJR_RELEASE_TASK == "identity"'

steps:
  - name: isolated-npm-cli
    image: node:24.21.0-bookworm@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
    commands:
      - npm install --prefix .tmp/publish-tools --cache /ci-cache/npm-publisher-download --ignore-scripts --no-audit --no-fund --prefer-offline --registry=https://registry.npmjs.org npm@11.21.1

  - name: identity
    image: node:24.21.0-bookworm@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
    environment:
      GH_TOKEN:
        from_secret: publish_github_token
      NPM_STAGE_TOKEN:
        from_secret: publish_npm_stage_token
    commands:
      - export PATH="$PWD/.tmp/publish-tools/node_modules/.bin:$PATH"
      - python3 -B scripts/release_publish.py identity
