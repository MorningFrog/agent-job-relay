labels:
  platform: windows/amd64
  backend: local
  worker: ajr-win

clone:
  - name: git
    image: woodpeckerci/plugin-git:2.12.1
    settings:
      lfs: false
      partial: false

depends_on: [_ci-package-windows-test]

when:
  - event: push
    branch: main
  - event: pull_request
  - event: manual
    evaluate: 'AJR_RELEASE_TASK != "prepare" && AJR_RELEASE_TASK != "rehearse" && AJR_RELEASE_TASK != "inspect" && AJR_RELEASE_TASK != "identity" && AJR_RELEASE_TASK != "preview" && AJR_RELEASE_TASK != "stage" && AJR_RELEASE_TASK != "finalize" && AJR_RELEASE_TASK != "check"'

steps:
  - name: download-exact-packages
    image: pwsh
    environment:
      AJR_CI_ARTIFACT_ENDPOINT:
        from_secret: ci_artifact_endpoint
      AJR_CI_ARTIFACT_CA:
        from_secret: ci_artifact_ca
      AJR_CI_ARTIFACT_TOKEN:
        from_secret: ci_artifact_windows_token
    commands:
      - node scripts/ci_artifacts.mjs download windows-packages

  - name: installed-packages-and-host-loaders
    image: pwsh
    commands:
      - ./scripts/ci_windows_packages.ps1

  - name: failure-diagnostics
    image: pwsh
    environment:
      AJR_CI_ARTIFACT_ENDPOINT:
        from_secret: ci_artifact_endpoint
      AJR_CI_ARTIFACT_CA:
        from_secret: ci_artifact_ca
      AJR_CI_ARTIFACT_TOKEN:
        from_secret: ci_artifact_windows_token
    commands:
      - node scripts/ci_artifacts.mjs upload windows-diagnostics
    when:
      - status: failure
